[package]
name = "gitmap"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.32"
egui = "0.32"
tray-icon = "0.21"
git2 = "0.20"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
walkdir = "2"
dirs = "6"
