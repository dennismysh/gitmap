[package]
name = "gitmap"
version = "0.1.0"
edition = "2021"

[lib]
name = "gitmap"
path = "src/lib.rs"

[[bin]]
name = "gitmap"
path = "src/main.rs"

[dependencies]
eframe = "0.32"
egui = "0.32"
tray-icon = "0.21"
git2 = "0.20"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
walkdir = "2"
dirs = "6"
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication"] }

[features]
vendored-openssl = ["git2/vendored-openssl"]

[dev-dependencies]
tempfile = "3"
